<!DOCTYPE html>
<html>
<head>
  <title>¡Mis XV!</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;

    .card {

    }

    img {
      width: 100%;
      border-radius: 15px;
    }

    input, button {
      margin: 10px;
      padding: 12px;
      width: 80%;
      font-size: 16px;
      border-radius: 10px;
    }

    button {
      background: #9CAF88;
      color: black;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="card">

  <img src="invitacion.jpg">

  <h2>Confirma tu asistencia</h2>

  <input id="nombre" placeholder="Tu nombre completo">
  <input id="asistentes" type="number" placeholder="¿Cuántas personas te acompañan?">

  <button onclick="confirmar()">Confirmar</button>

</div>

<script>
async function confirmar() {

  const nombre = document.getElementById("nombre").value;
  const asistentes = document.getElementById("asistentes").value;

  if (!nombre || !asistentes) {
    alert("Llena todos los campos");
    return;
  }

  try {
    const response = await fetch("https://dkhqvedcrrtyrypuohnb.supabase.co/rest/v1/invitados", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRraHF2ZWRjcnJ0eXJ5cHVvaG5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5ODE5MjMsImV4cCI6MjA5MDU1NzkyM30.XkzEk6PtZ4ysjQTN9YZCt3UyP_F0g2C0PF-GSQRFptA",
        "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRraHF2ZWRjcnJ0eXJ5cHVvaG5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5ODE5MjMsImV4cCI6MjA5MDU1NzkyM30.XkzEk6PtZ4ysjQTN9YZCt3UyP_F0g2C0PF-GSQRFptA"
      },
      body: JSON.stringify({
        nombre: nombre,
        asistentes: asistentes
      })
    });

    if (response.ok) {
      alert("¡Confirmado! 🎉");
    } else {
      const errorText = await response.text();
      console.log("Error completo:", errorText);
      alert(errorText);
    }

  } catch (error) {

    alert("Error de conexión");

}
</script>

</body>
</html>
